name: Release

# Two ways in:
#   * push an annotated tag `v<semver>+<mc>` (e.g. v0.2.0+1.21.11) — the normal path, driven by
#     the /release skill
#   * run manually against an existing tag, with dry_run on, to rehearse without publishing
#
# Publishing is NOT automatic. The `publish` job targets the `modrinth` GitHub Environment, which
# has required reviewers — the build runs immediately, then waits for an approval click before
# anything is uploaded. MODRINTH_TOKEN lives on that environment, not on the repo, so no workflow
# running off `main` can reach it.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build (e.g. v0.2.0+1.21.11)'
        required: true
        type: string
      dry_run:
        description: 'Build and verify only — do not upload to Modrinth or cut a release'
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.value }}
      mc_version: ${{ steps.version.outputs.mc }}
      release_type: ${{ steps.version.outputs.release_type }}
      changelog: ${{ steps.changelog.outputs.body }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          # Annotated tag objects (and their messages) only come down with the full fetch.
          fetch-depth: 0

      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      # The one check that keeps the tag honest. gradle.properties is the source of truth; if the
      # tag disagrees with the version the build would actually produce, stop here rather than
      # publish a jar whose name contradicts the git history.
      - name: Verify tag matches composed version
        id: version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          composed="$(./gradlew -q printVersion)"
          expected="v${composed}"
          if [ "$TAG" != "$expected" ]; then
            echo "::error::Tag '$TAG' does not match the version this build produces ('$expected')."
            echo "::error::Fix modVersion/minecraft_version in gradle.properties, or retag."
            exit 1
          fi
          echo "value=${composed}" >> "$GITHUB_OUTPUT"
          echo "mc=${composed#*+}" >> "$GITHUB_OUTPUT"
          # Pre-1.0 ships as beta on Modrinth: the wire contract with mc-org still moves in
          # lockstep with the mod, so no jar is promised to outlive a webapp deploy yet.
          case "${composed%%+*}" in
            0.*) echo "release_type=beta" >> "$GITHUB_OUTPUT" ;;
            *)   echo "release_type=release" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Build and test
        run: ./gradlew build --stacktrace

      # The annotated tag message is the changelog, verbatim — it lands on the Modrinth version
      # page and in the GitHub release body. Fails closed: an unannotated tag has no message, and
      # publishing an empty changelog is worse than stopping.
      - name: Extract changelog from tag message
        id: changelog
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          body="$(git for-each-ref "refs/tags/${TAG}" --format='%(contents)')"
          if [ -z "${body//[[:space:]]/}" ]; then
            echo "::error::Tag '$TAG' has no message. Release notes come from the annotated tag —"
            echo "::error::create it with 'git tag -a', or use the /release skill."
            exit 1
          fi
          # `git tag -a` defaults to --cleanup=strip, which deletes every line starting with '#'
          # — i.e. all the markdown headings — without saying so. Missing headings almost always
          # means the tag was made without --cleanup=whitespace. Warn rather than fail: a release
          # with nothing player-visible is legitimately a single line with no headings.
          if ! printf '%s' "$body" | grep -q '^###'; then
            echo "::warning::Changelog has no '###' headings. If you expected some, the tag was"
            echo "::warning::likely created without --cleanup=whitespace, which strips them."
          fi
          {
            echo 'body<<SEAM_CHANGELOG_EOF'
            echo "$body"
            echo 'SEAM_CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: release-jars
          path: build/libs/*.jar
          if-no-files-found: error

      # Written from the build job so a dry run shows everything it verified without ever
      # touching the gated job — a rehearsal should not need an approval click.
      - name: Summarise
        env:
          DRY: ${{ inputs.dry_run && 'yes' || 'no' }}
        run: |
          set -euo pipefail
          {
            echo "### Seam Notebook ${{ steps.version.outputs.value }}"
            echo ""
            echo "* Minecraft: \`${{ steps.version.outputs.mc }}\`"
            echo "* Modrinth channel: \`${{ steps.version.outputs.release_type }}\`"
            echo "* Dry run: **${DRY}**"
            echo ""
            echo "Files:"
            for f in build/libs/*.jar; do echo "* \`$(basename "$f")\`"; done
            echo ""
            echo "Changelog:"
            echo ""
            git for-each-ref "refs/tags/${{ inputs.tag || github.ref_name }}" --format='%(contents)'
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: build
    # A dry run stops after `build`. Skipping the job entirely (rather than its steps) is what
    # keeps a rehearsal from queueing an approval request.
    if: ${{ inputs.dry_run != true }}
    runs-on: ubuntu-latest
    # Gates on manual approval and scopes MODRINTH_TOKEN to this job alone.
    environment: modrinth
    permissions:
      contents: write   # mc-publish creates the GitHub release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-jars
          path: artifacts

      - name: Publish to Modrinth and GitHub
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          # Slug rather than the project id — both are accepted. Swap to the id if the slug ever
          # changes; ids are immutable.
          modrinth-id: seam-notebook
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

          # `!(*-sources)` keeps the sources jar out of the release; only the remapped mod jar
          # is something a player should download.
          files: artifacts/!(*-sources).jar

          name: Seam Notebook ${{ needs.build.outputs.version }}
          version: ${{ needs.build.outputs.version }}
          version-type: ${{ needs.build.outputs.release_type }}
          changelog: ${{ needs.build.outputs.changelog }}

          loaders: fabric
          game-versions: ${{ needs.build.outputs.mc_version }}
          java: 21
