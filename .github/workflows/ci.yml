name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the in-flight run obsolete. `main` is exempt from
# cancellation so every commit that lands keeps a build record of its own.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # First run is slow (5-10 min): Loom downloads and remaps Minecraft before anything compiles.
    # Cached runs land around 1-2 min.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # Verifies gradle-wrapper.jar against the checksums Gradle publishes — the wrapper jar is
      # executable code in the repo, and this is what stops a tampered one from running here.
      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          # Matches jvmToolchain(21) in build.gradle.kts, so Gradle never has to provision a
          # second JDK. MC 1.21.11 targets Java 21.
          java-version: '21'
          distribution: temurin

      # Caches ~/.gradle, which covers Loom's own caches (~/.gradle/caches/fabric-loom) — the
      # expensive part. Only `main` writes the cache; branches read it, so a broken branch can
      # never poison the shared entry.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # `build` covers compile + test + remapJar in one invocation.
      - name: Build and test
        run: ./gradlew build --stacktrace

      - name: Resolve version
        id: version
        run: echo "value=$(./gradlew -q printVersion)" >> "$GITHUB_OUTPUT"

      # The remapped jar — the one that actually loads in Minecraft. Loom also leaves the
      # unmapped intermediary jar in build/libs; devlibs/ and sources are excluded here.
      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: seam-notebook-${{ steps.version.outputs.value }}
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
          if-no-files-found: ignore
