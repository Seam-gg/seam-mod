name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the in-flight run obsolete. `main` is exempt from
# cancellation so every commit that lands keeps a build record of its own.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # A cold run (no Gradle cache) is ~2 min: Loom downloads and remaps Minecraft before anything
    # compiles. The timeout is deliberately far above that, to catch a hang rather than a slow day.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Verifies gradle-wrapper.jar against the checksums Gradle publishes — the wrapper jar is
      # executable code in the repo, and this is what stops a tampered one from running here.
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          # Matches jvmToolchain(21) in build.gradle.kts, so Gradle never has to provision a
          # second JDK. MC 1.21.11 targets Java 21.
          java-version: '21'
          distribution: temurin

      # Caches ~/.gradle, which covers Loom's own caches (~/.gradle/caches/fabric-loom) — the
      # expensive part. Only `main` writes the cache; branches read it, so a broken branch can
      # never poison the shared entry.
      #
      # Pinned to v5 on purpose — do not bump to v6. v6 extracted the caching into
      # `gradle-actions-caching`, a closed-source component under Gradle's commercial Terms of Use
      # rather than the MIT licence. v5 is already on Node 24, so the pin costs us nothing.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # `build` covers compile + test + remapJar in one invocation.
      - name: Build and test
        run: ./gradlew build --stacktrace

      - name: Resolve version
        id: version
        run: echo "value=$(./gradlew -q printVersion)" >> "$GITHUB_OUTPUT"

      # The remapped jar — the one that actually loads in Minecraft. Loom also leaves the
      # unmapped intermediary jar in build/libs; devlibs/ and sources are excluded here.
      - name: Upload mod jar
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: seam-notebook-${{ steps.version.outputs.value }}
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
          if-no-files-found: ignore
